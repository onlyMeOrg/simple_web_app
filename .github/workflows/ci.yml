name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build, HTML e links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # O build já falha sozinho em emoji no text= do WhatsApp ou slug inválido
      # (função whatsapp() de src/dados/negocio.js).
      - run: npm run build
      - run: npx --yes html-validate "dist/**/*.html"
      # Os links internos são absolutos com o base do site (/simple_web_app/...).
      # Montar dist/ dentro de uma pasta com esse nome reproduz o GitHub Pages,
      # e o lychee confere os links internos de verdade.
      - run: mkdir site && cp -r dist site/simple_web_app
      - uses: lycheeverse/lychee-action@v2
        with:
          # api.github.com: evita gastar o rate limit anônimo em toda checagem de CI.
          # pgillets.github.io: é a própria URL de produção deste site — checar aqui
          # criaria uma dependência circular (o CI de um push/PR passaria a depender
          # do Pages já estar publicado e propagado, o que é instável e nem sempre
          # verdadeiro, sobretudo antes do primeiro deploy ou em forks).
          # wa.me / instagram.com / facebook.com: bloqueiam ou limitam bots
          # (403/429) de forma instável — não é sinal útil de link quebrado.
          # localhost: exemplos de desenvolvimento citados no README.
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/site
            --accept 200..=204,429
            --exclude "https://api\.github\.com.*"
            --exclude "https://pgillets\.github\.io.*"
            --exclude "https://wa\.me.*"
            --exclude "https://www\.instagram\.com.*"
            --exclude "https://www\.facebook\.com.*"
            --exclude "http://localhost.*"
            "site/**/*.html" "*.md" "docs/*.md"
          fail: true
